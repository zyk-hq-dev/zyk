# zyk — Railway service configuration for the zyk-mcp service (root directory: mcp-server/)
#
# Full setup (Postgres, hatchet-engine, zyk-mcp, variables, keys, security checklist):
#   docs/deploy-railway.md
#
# Summary:
#   - hatchet-engine: image ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.2 (pinned),
#     volume at /config, ADMIN_EMAIL/ADMIN_PASSWORD set, NO public domain or TCP proxy.
#   - zyk-mcp (this service): the only public domain. Variables:
#       ZYK_DATABASE_URL         = postgresql://${{Postgres.PGUSER}}:${{Postgres.PGPASSWORD}}@${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/zyk
#       HATCHET_HOST_PORT        = hatchet-engine.railway.internal:7077
#       HATCHET_CLIENT_HOST_PORT = hatchet-engine.railway.internal:7077
#       HATCHET_REST_URL         = http://hatchet-engine.railway.internal:8080
#       HATCHET_ADMIN_EMAIL      = ${{hatchet-engine.ADMIN_EMAIL}}
#       HATCHET_ADMIN_PASSWORD   = ${{hatchet-engine.ADMIN_PASSWORD}}
#     (or HATCHET_CLIENT_TOKEN instead of the HATCHET_ADMIN_* pair)
#   - API keys: `railway ssh --service zyk-mcp`, then `npm run admin -- tenant:create <name>`.
#   - Do NOT commit real values here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
